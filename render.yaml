# Render Blueprint for the IRconnect app (praxis-iq).
# Apply via Render Dashboard -> New -> Blueprint, pointed at this repo.
# One always-on web service (NiceGUI is a stateful websocket server with in-process
# caches + background jobs — it must NOT run serverless / spin down).
services:
  - type: web
    name: irconnect-app
    runtime: python
    plan: standard            # 2 GB RAM. pandas/numpy/reportlab + AI orchestration need it.
                              # Do NOT use "free": it spins down on idle, which kills the
                              # background jobs (market refresh, digest scheduler, peer-watch)
                              # and reintroduces cold-start latency.
    region: virginia          # MATCHED to the Neon project in AWS us-east-1 (see docs/DEPLOY.md §0).
                              # Do not move one without the other — cross-region adds ~60ms to
                              # every DB round-trip, and a page makes dozens.
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python app_nicegui.py
    healthCheckPath: /version # public, returns 200 (no auth) — safe health probe
    autoDeploy: true
    envVars:
      # ---- generated once by Render and kept stable across deploys ----
      - key: IRCONNECT_STORAGE_SECRET   # signs app.storage.user (the per-browser tenant pick)
        generateValue: true

      # ---- REQUIRED secrets: set in the Render dashboard (Environment tab) ----
      - key: DATABASE_URL               # Neon POOLED string (…-pooler.…neon.tech/…?sslmode=require)
        sync: false
      - key: ANTHROPIC_API_KEY          # AI script-gen / refine / structuring
        sync: false
      - key: ADMIN_EMAIL                # first admin account, seeded on boot
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_USER_PASSWORD      # initial password for provisioned client users
        sync: false
      - key: LIGHTHOUSE_APP_URL         # e.g. https://app.praxispointir.com — used in digest/push links
        sync: false

      # ---- Web Push (phone alerts). OPTIONAL: app boots without them; alerts just stay off ----
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT              # mailto:ir@praxispointir.com
        sync: false

      # ---- Email: outbound digests (SMTP) + inbound inbox polling (IMAP). Set if used ----
      - key: ZOHO_SMTP_HOST
        sync: false
      - key: ZOHO_SMTP_PORT
        sync: false
      - key: ZOHO_SMTP_USER
        sync: false
      - key: ZOHO_SMTP_PASS
        sync: false
      - key: ZOHO_FROM_NAME
        sync: false
      - key: MAIL_IMAP_HOST
        sync: false
      - key: MAIL_IMAP_PORT
        sync: false
      - key: MAIL_IMAP_USER
        sync: false
      - key: MAIL_IMAP_PASSWORD
        sync: false
      - key: MAIL_INBOX_POLL_MINUTES
        sync: false
      - key: MAIL_INBOX_CLIENT_IDS
        sync: false

      # ---- Optional integrations: set ONLY if the feature is in use ----
      - key: ANYMAILFINDER_API_KEY      # contact email discovery
        sync: false
      - key: ORS_API_KEY                # OpenRouteService (NDR geography)
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false

      # NOTE: DEV_TENANT and DEV_AUTOLOGIN are DEV-ONLY. Never set them here —
      # DEV_AUTOLOGIN bypasses the login screen (no password), which in production
      # would hand anyone a signed-in session. Their absence is the correct prod state.
